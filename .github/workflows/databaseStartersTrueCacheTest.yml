# This workflow runs the True Cache integration test only when its container implementation changes.

name: Run the True Cache container integration test

on:
  push:
    branches: [ main ]
    paths:
      - "database/starters/oracle-spring-boot-testcontainers/src/main/java/com/oracle/database/spring/testcontainers/TrueCacheContainer.java"
  pull_request:
    branches: [ main ]
    paths:
      - "database/starters/oracle-spring-boot-testcontainers/src/main/java/com/oracle/database/spring/testcontainers/TrueCacheContainer.java"

permissions:
  contents: read

jobs:
  true-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Run True Cache integration test
        working-directory: ./database/starters
        run: |
          mvn -pl oracle-spring-boot-testcontainers -am clean verify \
            -Dtest=TrueCacheContainerIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false
